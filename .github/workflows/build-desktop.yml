name: Build FormSaathi desktop apps
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: FormSaathi-macOS
          - os: windows-latest
            artifact: FormSaathi-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-desktop.txt
      - if: runner.os == 'macOS'
        run: pyinstaller --noconfirm --clean --windowed --name FormSaathi --osx-bundle-identifier com.formsaathi.desktop --add-data "index.html:." --add-data "app.js:." --add-data "styles.css:." --collect-all webview --collect-all pdfplumber --hidden-import=webview.platforms.cocoa desktop.py
      - if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --clean --windowed --name FormSaathi --add-data "index.html;." --add-data "app.js;." --add-data "styles.css;." --collect-all webview --collect-all pdfplumber desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/FormSaathi*
